name: Mettre à jour le manifest
on:
  push:
    branches: [main]
    paths: ['client/**', 'launcher-settings.json']
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/make-manifest.js client > /tmp/manifest.json && mv /tmp/manifest.json client/manifest.json
      - run: |
          git config user.name "aetheris-bot"
          git config user.email "bot@users.noreply.github.com"
          git add client/manifest.json
          git diff --cached --quiet || (git commit -m "Manifest" && git push)
